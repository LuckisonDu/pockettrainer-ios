# XcodeGen 工程：PocketTrainer（Congressional App Challenge 参赛作品）
name: PocketTrainer
options:
  bundleIdPrefix: com.pingstory
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, es, fr, Base]
  deploymentTarget:
    iOS: "17.0"
targets:
  PocketTrainer:
    type: application
    platform: iOS
    sources:
      - path: PocketTrainer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PocketTrainer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        ITSAppUsesNonExemptEncryption: false   # 只用 https（系统加密），不含自有加密；免出口合规问卷
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, es, fr]
        UILaunchScreen: {}
        UIFileSharingEnabled: true            # 可在「文件」App 里看到训练结果文件
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: PocketTrainer uses speech recognition only to turn your voice into text on this phone.
        NSMicrophoneUsageDescription: PocketTrainer uses the microphone only to turn your voice into text on this phone.
        NSCameraUsageDescription: Take photos to teach the model your own objects
        NSPhotoLibraryUsageDescription: Pick photos to teach the model your own objects
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pingstory.pockettrainer
        DEVELOPMENT_TEAM: ""   # put your own Apple team id here
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
